name: AI review

# Reviewed by my own bot (github.com/Juxn89/claude-pr-review-bot): one review per PR, comments only,
# it can never approve or block. Without the ANTHROPIC_API_KEY secret it runs in dry-run mode.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: Juxn89/claude-pr-review-bot@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-haiku-5-5
          ignore-globs: "**/Migrations/**"
          project-context: >-
            Appointment booking with a conversational agent on .NET 10 / C# 14. Clean Architecture: Domain has
            no dependencies but NodaTime. Times are NodaTime types, stored in UTC and shown on the business's
            clock. The agent proposes and holds a slot, never confirms one: a person does, with a button. No
            magic strings or numbers. Tabs for indentation.
