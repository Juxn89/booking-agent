name: CI

on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'ci/**', 'refactor/**', 'test/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, format & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      # TreatWarningsAsErrors is on: any analyzer warning fails here.
      - run: dotnet build -c Release --no-restore
      - run: dotnet format whitespace --verify-no-changes --no-restore
      # Every test project, the integration tests included: they start Postgres with Testcontainers on the
      # runner's Docker.
      - run: dotnet test -c Release --no-build
      # The evals' harness, scored with the oracle (no model, no key, no cost): it must come out perfect. The
      # paid run with Claude is manual (evals/README.md).
      - run: dotnet run --project evals/BookingAgent.Evals -c Release --no-build -- run oracle

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Frozen: CI installs exactly the lockfile, and pnpm re-checks every entry against minimumReleaseAge.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

