name: CI

on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'ci/**', 'refactor/**', 'test/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, format & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      # TreatWarningsAsErrors is on: any analyzer warning fails here.
      - run: dotnet build -c Release --no-restore
      - run: dotnet format whitespace --verify-no-changes --no-restore
      # Every test project, the integration tests included: they start Postgres with Testcontainers on the
      # runner's Docker.
      - run: dotnet test -c Release --no-build
      # The evals' harness, scored with the oracle (no model, no key, no cost): it must come out perfect. The
      # paid run with Claude is manual (evals/README.md).
      - run: dotnet run --project evals/BookingAgent.Evals -c Release --no-build -- run oracle

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Frozen: CI installs exactly the lockfile, and pnpm re-checks every entry against minimumReleaseAge.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # The real API (notifications, sign-in codes, panel, SignalR) and web app against Postgres and Mailpit; the
    # assistant plays a script (web/e2e/fixtures/assistant-script.json), so this job needs no key and costs nothing.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5434:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports: ['1026:1025', '8026:8025']
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright starts the API (dotnet run) and a production build of the web app (playwright.config.ts).
      - run: pnpm e2e
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
