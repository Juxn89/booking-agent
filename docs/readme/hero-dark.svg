<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">booking-agent</title>
<desc id="desc">Customers book by chatting; the assistant holds the slot and a person confirms it with a button. Postgres makes double booking impossible, and the clinic's calendar updates live.</desc>
<style>
	.flow { stroke-dasharray: 6 7; animation: flow 1.6s linear infinite; }
	.pop { opacity: 0; animation: pop .5s ease-out forwards; }
	.glow { animation: glow 2.4s ease-in-out infinite alternate; }
	@keyframes flow { to { stroke-dashoffset: -26; } }
	@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
	@keyframes glow { from { opacity: .55; } to { opacity: 1; } }
	@media (prefers-reduced-motion: reduce) { .flow, .glow { animation: none; } .pop { animation: none; opacity: 1; } }
</style>
<defs>
	<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a5b4fc"/><stop offset=".6" stop-color="#4338ca"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<linearGradient id="metric" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset=".55" stop-color="#4338ca"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<radialGradient id="orbIndigo"><stop offset="0" stop-color="#4338ca" stop-opacity="0.32"/><stop offset="1" stop-color="#4338ca" stop-opacity="0"/></radialGradient>
	<radialGradient id="orbAmber"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.22399999999999998"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
	<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/></pattern>
	<clipPath id="frame"><rect width="1280" height="460" rx="28"/></clipPath>
	<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<g clip-path="url(#frame)">
	<rect width="1280" height="460" fill="#0a0e13"/>
	<rect width="1280" height="460" fill="url(#dots)"/>
	<circle cx="180" cy="40" r="340" fill="url(#orbIndigo)"/>
	<circle cx="1060" cy="470" r="360" fill="url(#orbAmber)"/>
</g>
<rect x=".5" y=".5" width="1279" height="459" rx="28" fill="none" stroke="#262d45"/>

<g transform="translate(72 70)">
	<rect width="236" height="30" rx="15" fill="#11151f" stroke="#262d45"/>
	<circle cx="18" cy="15" r="4.5" fill="#a5b4fc" class="glow"/>
	<text x="31" y="20" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing=".1em" fill="#94a3b8">OPEN SOURCE · .NET 10 · MIT</text>
</g>
<text x="68" y="172" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-.03em" fill="#f1f5f9">booking<tspan fill="url(#brand)">-agent</tspan></text>
<text x="72" y="230" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f1f5f9">Appointments booked by chatting.</text>
<text x="72" y="268" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8">The assistant finds and holds the time; a person confirms it.</text>
<text x="72" y="300" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8">It can never confirm, and no slot is ever booked twice.</text>
<g transform="translate(72 352)"><rect width="164.4" height="32" rx="16" fill="#11151f" stroke="#262d45"/><text x="82.2" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Claude Haiku 5.5</text></g><g transform="translate(244.4 352)"><rect width="172.8" height="32" rx="16" fill="#11151f" stroke="#262d45"/><text x="86.4" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">A person confirms</text></g><g transform="translate(425.20000000000005 352)"><rect width="172.8" height="32" rx="16" fill="#11151f" stroke="#262d45"/><text x="86.4" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">No double booking</text></g><g transform="translate(606 352)"><rect width="114" height="32" rx="16" fill="#11151f" stroke="#262d45"/><text x="57" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Live panel</text></g><g transform="translate(728 352)"><rect width="122.4" height="32" rx="16" fill="#11151f" stroke="#262d45"/><text x="61.2" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Evals 28/28</text></g>

<!-- The customer's message -->
<g transform="translate(676 74)" filter="url(#soft)">
	<rect width="218" height="64" rx="16" fill="#4338ca"/>
	<text x="16" y="27" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Limpieza el lunes</text>
	<text x="16" y="46" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">a las 10, por favor</text>
</g>

<path d="M786 140 C 786 168, 800 170, 800 188" fill="none" stroke="#a5b4fc" stroke-width="2.2" class="flow"/>

<!-- The held slot, with the button only the person presses -->
<g transform="translate(676 190)" filter="url(#soft)">
	<rect width="236" height="142" rx="18" fill="#151a27" stroke="#f59e0b" stroke-width="1.5"/>
	<text x="18" y="30" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#f59e0b">HORARIO APARTADO</text>
	<text x="18" y="54" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Limpieza dental</text>
	<text x="18" y="74" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">lunes 26 · 10:00 · 4:57 min</text>
	<g transform="translate(18 92)"><g class="pop" style="animation-delay:.4s">
		<rect width="118" height="32" rx="9" fill="#4338ca"/>
		<text x="59" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Confirmar</text>
	</g></g>
	<g transform="translate(118 112)"><g class="pop" style="animation-delay:.9s">
		<path d="M0 0 l0 18 l5 -5 l4 8 l3 -1.5 l-4 -8 l7 0 z" fill="#f1f5f9" stroke="#151a27" stroke-width="1.2"/>
	</g></g>
</g>

<path d="M912 262 C 960 262, 958 200, 1000 196" fill="none" stroke="#f59e0b" stroke-width="2.2" class="flow"/>

<!-- The clinic's calendar, live -->
<g transform="translate(998 104)" filter="url(#soft)">
	<rect width="216" height="182" rx="18" fill="#151a27" stroke="#262d45"/>
	<text x="16" y="30" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Panel · en vivo</text>
	<circle cx="196" cy="25" r="4.5" fill="#16a34a" class="glow"/>
	<rect x="16" y="44" width="32" height="118" rx="6" fill="#2c3550" fill-opacity=".35"/><rect x="52" y="44" width="32" height="118" rx="6" fill="#2c3550" fill-opacity=".35"/><rect x="88" y="44" width="32" height="118" rx="6" fill="#2c3550" fill-opacity=".35"/><rect x="124" y="44" width="32" height="118" rx="6" fill="#2c3550" fill-opacity=".35"/><rect x="160" y="44" width="32" height="118" rx="6" fill="#2c3550" fill-opacity=".35"/>
	<g transform="translate(16 92)"><g class="pop" style="animation-delay:1.3s">
		<rect width="32" height="30" rx="5" fill="#4338ca" fill-opacity=".18" stroke="#4338ca"/>
		<rect x="4" y="6" width="12" height="5" rx="2" fill="#4338ca"/>
		<rect x="4" y="15" width="22" height="4" rx="2" fill="#94a3b8" fill-opacity=".7"/>
	</g></g>
	<text x="16" y="172" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="10.5" fill="#94a3b8">exclusion constraint ✓</text>
</g>
</svg>
